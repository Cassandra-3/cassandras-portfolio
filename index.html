<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cassandra Dsouza — GRC & Cybersecurity Portfolio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #333; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { useState } = React;

    function Portfolio() {
      const [expandedProject, setExpandedProject] = useState(null);
      const [expandedSkill, setExpandedSkill] = useState(null);

      const projects = [
        {
          id: 'data-next-step',
          title: 'Building ISO 27001 + SOC 2 Compliance Program from Scratch',
          company: 'Data Next Step',
          period: 'March – November 2025',
          impact: 'Took program from zero to audit-readiness in 4 months',
          skills: ['ISO 27001', 'SOC 2', 'Vanta', 'Risk Management', 'Policy Development'],
          details: [
            'Evaluated 3–5 GRC platforms (CISO Assistant, Vanta, others) on ease of use, control coverage, and cost; recommended Vanta to leadership',
            'Implemented and configured Vanta to establish SOC 2 and ISO 27001 compliance frameworks, setting up control mappings and evidence workflows',
            'Built organization\'s cyber risk register from scratch — mapped assets, identified threats, documented 20+ risks tagged to CIA triad',
            'Executed third-party vendor risk assessments by reviewing SOC reports, DPAs, and agreements',
            'Developed and maintained security policies aligned with both frameworks, managed full policy lifecycle (review cycles, expiry tracking)',
            'Coordinated security awareness activities — policy attestation, training tracking, employee reminders',
            'Monitored remediation timelines, escalated overdue items, and reported progress to management'
          ]
        },
        {
          id: 'incident-investigation',
          title: 'Security Incident Investigation & Response',
          company: 'Data Next Step',
          period: 'November 2025',
          impact: 'Investigated and documented real-world malware incident',
          skills: ['Incident Response', 'Threat Analysis', 'Documentation', 'Communication'],
          details: [
            'Investigated a live malware discovery on a team member\'s device',
            'Gathered information from impacted staff and management, documented findings in internal system',
            'Authored separate written incident report for audit trail',
            'Developed incident response procedure and checklist for future events',
            'Created anonymous security incident reporting mechanism for employees',
            'Demonstrates hands-on threat analysis and structured incident management'
          ]
        },
        {
          id: 'risk-management',
          title: 'Risk Register & Vendor Management Program',
          company: 'Data Next Step',
          period: 'March – November 2025',
          impact: 'Managed 20+ risk scenarios and coordinated evidence across 5 teams',
          skills: ['Risk Analysis', 'Excel (Power Query, Pivot Tables)', 'Vendor Assessment', 'CIA Triad'],
          details: [
            'Structured and maintained organization\'s first cyber risk register',
            'Mapped assets, identified threats, and scored risks using CIA triad (Confidentiality, Integrity, Availability)',
            'Executed third-party risk assessments by reviewing vendor documentation, SOC reports, and data sharing agreements',
            'Scored vendors by data sensitivity and risk level',
            'Used Excel (pivot tables, Power Query, VLOOKUP) to track risks, remediation status, and evidence across compliance controls',
            'Coordinated evidence collection from 5 cross-functional teams (100+ items total)',
            'Escalated overdue control gaps to management and tracked remediation progress'
          ]
        },
        {
          id: 'lighthouse-labs',
          title: 'Threat Detection & SIEM Analysis (Lighthouse Labs)',
          company: 'Lighthouse Labs Cybersecurity Diploma',
          period: 'November 2024 – February 2025',
          impact: 'Completed hands-on labs in threat detection, alert analysis, and TTP mapping',
          skills: ['SIEM', 'Threat Analysis', 'MITRE ATT&CK', 'Malware Analysis', 'Phishing Investigation'],
          details: [
            'Completed lab-based SIEM/EDR alert analysis and triage',
            'Investigated malware and phishing samples, mapped TTPs to MITRE ATT&CK framework',
            'Performed log analysis and IDS/IPS rule evaluation',
            'Learned firewall rule configuration and network security fundamentals',
            'Studied Blue Team operations and incident response procedures',
            'Note: Lab work, not production experience — but demonstrates foundational threat analysis competency'
          ]
        }
      ];

      const expertiseAreas = [
        {
          id: 'grc',
          title: 'GRC & Compliance Frameworks',
          items: ['ISO 27001 (near audit-readiness)', 'SOC 2 (groundwork/foundational)', 'NIST Cybersecurity Framework', 'GDPR', 'Quebec Law 25', 'Risk Register Management']
        },
        {
          id: 'identity',
          title: 'Identity & Access Management',
          items: ['Active Directory / Entra ID (provisioning, deprovisioning, access reviews)', 'MFA / RSA Hardware Tokens', 'Access control escalation', 'Non-compliant access remediation']
        },
        {
          id: 'risk',
          title: 'Risk & Vendor Management',
          items: ['Risk register development', 'Threat identification & mapping', 'Vendor risk assessments', 'Third-party compliance review', 'Evidence coordination']
        },
        {
          id: 'security',
          title: 'Security Monitoring & Threat Analysis',
          items: ['Carbon Black EDR (application control alert triage)', 'SIEM lab-based analysis', 'Malware/phishing investigation', 'MITRE ATT&CK TTP mapping', 'Log analysis']
        },
        {
          id: 'tools',
          title: 'Tools & Systems',
          items: ['Vanta (evidence workflows, control testing, automation)', 'CISO Assistant', 'Microsoft 365 (Exchange, Teams, SharePoint)', 'ServiceNow', 'Excel (Power Query, Pivot Tables, VLOOKUP)']
        }
      ];

      const journey = [
        { year: '2020–2021', milestone: 'Technical Support Advisor', role: 'Learned customer service, basic troubleshooting' },
        { year: '2022–2024', milestone: 'Service Desk Analyst (L1/L2)', role: 'Enterprise IT security, Active Directory, EDR alert triage, regulated banking environment' },
        { year: '2024–2025', milestone: 'Cybersecurity Diploma', role: 'SIEM, threat detection, security frameworks, incident response fundamentals' },
        { year: '2025', milestone: 'GRC & Audit Specialist', role: 'Built compliance program from scratch, ISO 27001/SOC 2, risk management, vendor assessments' },
        { year: 'Now', milestone: 'ISC2 Certified in Cybersecurity (CC)', role: 'In-progress certification; deepening GRC and security fundamentals' }
      ];

      const certifications = [
        { title: 'AWS Certified Cloud Practitioner', issued: 'October 2023', valid: 'Through October 2026' },
        { title: 'Cybersecurity Diploma (Lighthouse Labs)', issued: 'February 2025', focus: 'SIEM, threat detection, vulnerability assessment, security frameworks' },
        { title: 'ISC2 Certified in Cybersecurity (CC)', status: 'In progress', focus: 'Core cybersecurity domains and GRC fundamentals' }
      ];

      return (
        <div style={{ maxWidth: '900px', margin: '0 auto', padding: '0 20px' }}>
          {/* Hero */}
          <section style={{ paddingTop: '40px', paddingBottom: '60px', borderBottom: '1px solid #e5e5e5' }}>
            <h1 style={{ fontSize: '32px', fontWeight: '500', margin: '0 0 12px 0' }}>Cassandra Dsouza</h1>
            <p style={{ fontSize: '16px', color: '#666', margin: '0 0 20px 0' }}>GRC & Compliance Specialist | Cybersecurity | IT Security</p>
            <p style={{ fontSize: '14px', lineHeight: '1.6', margin: '0 0 20px 0' }}>
              Building security compliance programs and managing enterprise risk in B2B SaaS environments. 2+ years of enterprise IT support in regulated banking. AWS Certified Cloud Practitioner. Pursuing ISC2 CC. Strong foundation in GRC frameworks (ISO 27001, SOC 2, NIST CSF) and hands-on experience with compliance automation, threat analysis, and vendor risk management.
            </p>
            <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
              <a href="https://linkedin.com/in/cassandradsouza54a784168" target="_blank" style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '10px 16px', borderRadius: '8px', border: '1px solid #ddd', backgroundColor: '#f5f5f5', cursor: 'pointer', fontSize: '14px', fontWeight: '500' }}>
                LinkedIn ↗
              </a>
              <a href="mailto:cassandra.i.dsouza@gmail.com" style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '10px 16px', borderRadius: '8px', border: '1px solid #ddd', backgroundColor: '#f5f5f5', cursor: 'pointer', fontSize: '14px', fontWeight: '500' }}>
                Email
              </a>
            </div>
          </section>

          {/* Journey */}
          <section style={{ paddingTop: '40px', paddingBottom: '60px', borderBottom: '1px solid #e5e5e5' }}>
            <h2 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 24px 0' }}>Learning journey</h2>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {journey.map((item, idx) => (
                <div key={idx} style={{ display: 'flex', gap: '16px' }}>
                  <div style={{ minWidth: '100px', fontSize: '13px', color: '#666', fontWeight: '500' }}>{item.year}</div>
                  <div>
                    <p style={{ fontSize: '14px', fontWeight: '500', margin: '0 0 4px 0' }}>{item.milestone}</p>
                    <p style={{ fontSize: '13px', color: '#666', margin: '0' }}>{item.role}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Featured Projects */}
          <section style={{ paddingTop: '40px', paddingBottom: '60px', borderBottom: '1px solid #e5e5e5' }}>
            <h2 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 24px 0' }}>Featured projects</h2>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              {projects.map((project) => (
                <div key={project.id} style={{ border: '1px solid #e5e5e5', borderRadius: '12px', overflow: 'hidden' }}>
                  <button
                    onClick={() => setExpandedProject(expandedProject === project.id ? null : project.id)}
                    style={{
                      width: '100%',
                      padding: '16px',
                      backgroundColor: expandedProject === project.id ? '#f9f9f9' : 'transparent',
                      border: 'none',
                      cursor: 'pointer',
                      textAlign: 'left',
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'flex-start',
                      gap: '12px'
                    }}
                  >
                    <div style={{ flex: 1 }}>
                      <h3 style={{ fontSize: '14px', fontWeight: '500', margin: '0 0 6px 0' }}>{project.title}</h3>
                      <p style={{ fontSize: '13px', color: '#666', margin: '0 0 8px 0' }}>{project.company} • {project.period}</p>
                      <p style={{ fontSize: '12px', color: '#999', margin: '0' }}>{project.impact}</p>
                    </div>
                    <span style={{ fontSize: '18px', transform: expandedProject === project.id ? 'rotate(180deg)' : 'rotate(0)', transition: 'transform 0.2s' }}>▼</span>
                  </button>
                  {expandedProject === project.id && (
                    <div style={{ padding: '0 16px 16px 16px', borderTop: '1px solid #e5e5e5', backgroundColor: '#f9f9f9' }}>
                      <div style={{ marginBottom: '12px' }}>
                        <p style={{ fontSize: '12px', fontWeight: '500', color: '#666', margin: '0 0 8px 0', textTransform: 'uppercase' }}>Key skills</p>
                        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                          {project.skills.map((skill, idx) => (
                            <span key={idx} style={{ fontSize: '12px', padding: '4px 10px', backgroundColor: '#fff', borderRadius: '6px', color: '#333', border: '0.5px solid #ddd' }}>
                              {skill}
                            </span>
                          ))}
                        </div>
                      </div>
                      <div>
                        <p style={{ fontSize: '12px', fontWeight: '500', color: '#666', margin: '0 0 8px 0', textTransform: 'uppercase' }}>What I did</p>
                        <ul style={{ margin: '0', paddingLeft: '20px' }}>
                          {project.details.map((detail, idx) => (
                            <li key={idx} style={{ fontSize: '13px', marginBottom: '6px', lineHeight: '1.5' }}>{detail}</li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </section>

          {/* Expertise */}
          <section style={{ paddingTop: '40px', paddingBottom: '60px', borderBottom: '1px solid #e5e5e5' }}>
            <h2 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 24px 0' }}>Expertise areas</h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '12px' }}>
              {expertiseAreas.map((area) => (
                <div key={area.id} style={{ border: '1px solid #e5e5e5', borderRadius: '12px', overflow: 'hidden' }}>
                  <button
                    onClick={() => setExpandedSkill(expandedSkill === area.id ? null : area.id)}
                    style={{
                      width: '100%',
                      padding: '16px',
                      backgroundColor: expandedSkill === area.id ? '#f9f9f9' : 'transparent',
                      border: 'none',
                      cursor: 'pointer',
                      textAlign: 'left',
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'flex-start',
                      gap: '12px'
                    }}
                  >
                    <h3 style={{ fontSize: '14px', fontWeight: '500', margin: '0' }}>{area.title}</h3>
                    <span style={{ fontSize: '16px', transform: expandedSkill === area.id ? 'rotate(180deg)' : 'rotate(0)', transition: 'transform 0.2s' }}>▼</span>
                  </button>
                  {expandedSkill === area.id && (
                    <div style={{ padding: '12px 16px 16px 16px', borderTop: '1px solid #e5e5e5', backgroundColor: '#f9f9f9' }}>
                      <ul style={{ margin: '0', paddingLeft: '20px' }}>
                        {area.items.map((item, idx) => (
                          <li key={idx} style={{ fontSize: '13px', marginBottom: '6px', lineHeight: '1.4' }}>{item}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </section>

          {/* Certifications */}
          <section style={{ paddingTop: '40px', paddingBottom: '60px', borderBottom: '1px solid #e5e5e5' }}>
            <h2 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 24px 0' }}>Certifications & training</h2>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              {certifications.map((cert, idx) => (
                <div key={idx} style={{ padding: '16px', backgroundColor: '#f9f9f9', borderRadius: '12px', border: '0.5px solid #e5e5e5' }}>
                  <h3 style={{ fontSize: '14px', fontWeight: '500', margin: '0 0 4px 0' }}>{cert.title}</h3>
                  <p style={{ fontSize: '12px', color: '#666', margin: '0', lineHeight: '1.5' }}>
                    {cert.issued && `${cert.issued}`}
                    {cert.valid && ` • Valid ${cert.valid}`}
                    {cert.status && cert.status}
                    {cert.focus && ` • ${cert.focus}`}
                  </p>
                </div>
              ))}
            </div>
          </section>

          {/* Footer CTA */}
          <section style={{ paddingTop: '40px', paddingBottom: '40px', textAlign: 'center' }}>
            <h2 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 12px 0' }}>Let's connect</h2>
            <p style={{ fontSize: '14px', color: '#666', margin: '0 0 20px 0' }}>Open to GRC, compliance, and security roles. Let me know how I can help.</p>
            <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
              <a href="https://linkedin.com/in/cassandradsouza54a784168" target="_blank" style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '12px 20px', borderRadius: '8px', backgroundColor: '#3b82f6', color: 'white', fontSize: '14px', fontWeight: '500', border: 'none' }}>
                LinkedIn Profile ↗
              </a>
              <a href="mailto:cassandra.i.dsouza@gmail.com" style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '12px 20px', borderRadius: '8px', border: '1px solid #ddd', backgroundColor: 'white', fontSize: '14px', fontWeight: '500' }}>
                Email me
              </a>
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.render(<Portfolio />, document.getElementById('root'));
  </script>
</body>
</html>
